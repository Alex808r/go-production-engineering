services:
  # ============================================================================
  # Сервис реляционной базы данных PostgreSQL 16
  # ============================================================================
  postgres:
    # Официальный легковесный образ PostgreSQL на базе Alpine Linux
    image: postgres:16-alpine
    container_name: wallet-postgres

    # Автоматический перезапуск контейнера при сбоях или после перезагрузки хоста
    restart: unless-stopped

    # Чтение переменных окружения из файла config.env согласно требованиям ТЗ
    env_file:
      - config.env

    # Настройка параметров подключения к БД:
    # Конструкция ${VAR:-default} берет значение из config.env, а если оно пустое — использует дефолт.
    environment:
      POSTGRES_DB: ${DB_NAME:-wallet_db}
      POSTGRES_USER: ${DB_USER:-wallet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet_password}

    # Проброс порта: порт хоста -> порт контейнера (5432:5432)
    ports:
      - "${DB_PORT:-5432}:5432"

    # Подключение постоянных дисковых томов (Volumes):
    volumes:
      # Хранилище файлов базы данных, чтобы балансы и данные не исчезали при перезапуске контейнеров
      - pgdata:/var/lib/postgresql/data
      # Монтирование SQL-миграций в специальную директорию инициализации PostgreSQL.
      # Скрипты из этой папки автоматически выполняются один раз при создании новой пустой базы.
      # :ro (read-only) защищает миграции от изменения внутри контейнера.
      - ./migrations:/docker-entrypoint-initdb.d:ro

    # --------------------------------------------------------------------------
    # Проверка готовности базы данных (Healthcheck):
    # Утилита pg_isready проверяет, что сервер не просто запущен как процесс,
    # а уже готов принимать реальные SQL-клиентские подключения.
    # --------------------------------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wallet_user} -d ${DB_NAME:-wallet_db}"]
      interval: 3s      # Частота проверки (каждые 3 секунды)
      timeout: 3s       # Таймаут одной проверки
      retries: 10       # Считать базу готовой после успешной проверки
      start_period: 3s  # Время ожидания до первой проверки

    # --------------------------------------------------------------------------
    # Тюнинг производительности PostgreSQL под 1000 RPS:
    # max_connections=200 — увеличенный пул одновременных подключений (дефолт всего 100).
    # shared_buffers=256MB — объем оперативной памяти под кэш страниц и буферизацию.
    # --------------------------------------------------------------------------
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

    # Подключение к изолированной сети проекта
    networks:
      - wallet-network

  # ============================================================================
  # Сервис бэкенд-приложения на Go
  # ============================================================================
  app:
    # Сборка образа на основе Dockerfile в текущей директории
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-app

    restart: unless-stopped

    # Передача настроек из файла config.env в контейнер приложения
    env_file:
      - config.env

    # Проброс HTTP-порта сервиса (8080:8080)
    ports:
      - "${APP_PORT:-8080}:8080"

    # --------------------------------------------------------------------------
    # КРИТИЧЕСКИ ВАЖНО: Синхронизация старта приложения с базой данных.
    # condition: service_healthy заставляет Docker ждать, пока сервис postgres
    # не пройдет свой healthcheck (pg_isready) и не подтвердит 100% готовность.
    # Это предотвращает частую ошибку "connection refused" при старте.
    # --------------------------------------------------------------------------
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - wallet-network

# ==============================================================================
# Определение томов (Volumes) для персистентного хранения данных
# ==============================================================================
volumes:
  pgdata:
    driver: local

# ==============================================================================
# Изолированная виртуальная сеть (Bridge network):
# Позволяет контейнерам общаться друг с другом по именам (например, хост "postgres")
# без конфликта с другими сервисами на сервере.
# ==============================================================================
networks:
  wallet-network:
    driver: bridge
