# Определение сервисов NoSQL баз данных (MongoDB и Redis)
services:
  # ============================================================================
  # Документоориентированная СУБД MongoDB
  # ============================================================================
  mongo:
    # Официальный базовый образ MongoDB с Docker Hub
    image: mongo
    # Анонимный том для персистентного хранения файлов коллекций и индексов Mongo
    volumes:
      - /data/db/mongo
    # Проброс стандартного порта MongoDB: 27017 на хосте -> 27017 внутри контейнера
    ports:
      - "27017:27017"
  
  # ============================================================================
  # In-Memory хранилище структуры данных и кэш Redis
  # ============================================================================
  redis:
    # Официальный образ Redis
    image: redis
    # Анонимный том для сохранения дампов данных на диск (RDB/AOF персистентность)
    volumes:
      - /data/db/redis
    # Проброс стандартного порта Redis: 6379 на хосте -> 6379 внутри контейнера
    ports:
      - "6379:6379"
  