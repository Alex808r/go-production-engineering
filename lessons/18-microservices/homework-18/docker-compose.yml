version: '3.8'

services:
  shortener:
    build:
      context: ..
      dockerfile: homework-18/Dockerfile
    container_name: url-shortener-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
